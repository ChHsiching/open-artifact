<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Smoke canvas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 880px; height: 560px; box-sizing: border-box; padding: 64px; display: flex; flex-direction: column; gap: 24px; background: #fbfbf8; font-family: Georgia, serif">
<h1 style="margin: 0; font-size: 56px; color: {{accent}}">Smoke canvas</h1>
<p style="margin: 0; font-size: 24px; color: #4a4f55">An artboard the smoke test opens.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#666666"},"$preview":{"width":880,"height":560}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#666666' };
}
}
</script>
</body>
</html>
