[package]
name = "open-artifact-canvas"
description = "Generic WebGL2 canvas engine: scene mirror, camera, spatial index, gestures and renderer."
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen.workspace = true
lyon_tessellation = "1.0.22"
rstar = { version = "0.12", default-features = false }
etagere = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "WebGl2RenderingContext",
  "WebGlProgram",
  "WebGlShader",
  "WebGlBuffer",
  "WebGlTexture",
  "WebGlFramebuffer",
  "WebGlUniformLocation",
  "WebGlVertexArrayObject",
  "ImageBitmap",
  "HtmlImageElement",
  "HtmlCanvasElement",
  "ImageData",
] }
