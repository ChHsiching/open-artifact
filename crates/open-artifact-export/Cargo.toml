[package]
name = "open-artifact-export"
description = "Export packing shared by the editors: zip (deflate), PDF assembly and PNG re-compression. Runs in a Worker."
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen.workspace = true
miniz_oxide = { version = "0.8.9", default-features = false, features = ["with-alloc"] }
crc32fast = { version = "1.5.0", default-features = false }
