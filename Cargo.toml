# Rust crates compiled to WebAssembly for the editors and the CLI.
# Build: node scripts/build-wasm.mjs (writes the packages under packages/wasm-*).
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
wasm-bindgen = "=0.2.117"
libm = "0.2.16"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
